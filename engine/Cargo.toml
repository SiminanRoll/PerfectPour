[package]
name = "perfect-pour-engine"
version = "1.0.2"
edition = "2021"
description = "Dependency-free Rust simulation for the offline Perfect Pour browser game"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

