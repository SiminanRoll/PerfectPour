name: Perfect Pour CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Rust, Wasm, and standalone release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Rebuild Rust WebAssembly engine and run native tests
        run: python3 engine/build_engine.py

      - name: Test compiled Wasm engine
        run: node tests/engine/wasm-smoke.mjs

      - name: Test business and one-pour acceptance
        run: node tests/browser/v101-business-acceptance.mjs

      - name: Test catalog reachability and economy
        run: node tests/engine/v102-balance.mjs

      - name: Test custom recipes and legacy migration
        run: node tests/engine/v103-recipes.mjs

      - name: Test two-soda portions and interrupted saves
        run: node tests/engine/v104-mixtures.mjs

      - name: Test ice fizz, locking, and save compatibility
        run: node tests/engine/v106-ice.mjs

      - name: Test the primary control flow
        run: node tests/browser/v103-control-flow.mjs

      - name: Test UI and save adapter contracts
        run: node tests/browser/v102-ui-contract.mjs

      - name: Test startup menu and saved career safety
        run: node tests/browser/v1032-menu.mjs

      - name: Test music scheduling and mute lifecycle
        run: node tests/audio/music-lifecycle.mjs

      - name: Test pour, fizz, and feedback effects
        run: node tests/audio/game-sounds.mjs

      - name: Test offline verifier regressions
        run: node tests/browser/verify-offline-selftest.mjs

      - name: Build standalone HTML
        run: python3 scripts/build.py

      - name: Verify offline release
        run: node tests/browser/verify_offline.mjs dist/index.html

      - name: Commit rebuilt engine and standalone HTML to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add engine/perfect_pour_engine.wasm dist/index.html
          if ! git diff --cached --quiet; then
            git config user.name "Perfect Pour Release Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build V1.06.1 engine and standalone game"
            git push origin HEAD:main
          fi
